---
name: Issue
description: One quick form for bugs, features, or copy tweaks
title: "[ISSUE]"
labels: "features, needs triage, bugs, content"
assignees: [ ]
---
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type 
      options:
        - Bug
        - Feature
        - Content / SEO
    validations: { required: true }

  - type: input
    id: page
    attributes:
      label: Page/component
      placeholder: "e.g. /pricing or Navbar.vue"

  - type: textarea
    id: details
    attributes:
      label: What’s happening (or should happen) *
      description: Be concise; screenshots welcome.
      placeholder: |
        For bugs — describe actual vs. expected.
        For features — describe the user value.
        For content — paste the text to change.
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (bugs only)
      placeholder: |
        1. …
        2. …
