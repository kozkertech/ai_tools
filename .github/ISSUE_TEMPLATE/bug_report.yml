name: Bug Report
description: Report a problem with the Kozker Tech website
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! This helps us keep the Kozker Tech website running smoothly.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues before creating a new one.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: problem-description
    attributes:
      label: What's the problem?
      description: Describe what's not working as expected
      placeholder: "Example: The contact form isn't sending emails when submitted"
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Where did you find this issue?
      description: What page or section of the website?
      placeholder: "https://kozker.com/contact or 'Homepage contact form'"
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What should happen instead?
      description: Describe the expected behavior
      placeholder: "The form should send an email and show a success message"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce (if applicable)
      description: How can we recreate this issue?
      placeholder: |
        1. Go to the contact page
        2. Fill out the form
        3. Click submit
        4. See error message
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority level
      description: How urgent is this issue?
      options:
        - "High - Website is broken for users"
        - "Medium - Noticeable issue but website still functions"
        - "Low - Minor cosmetic or nice-to-have fix"
      default: 1
    validations:
      required: true

  - type: textarea
    id: browser-info
    attributes:
      label: Browser/Device info (if relevant)
      description: What browser, device, or screen size did you notice this on?
      placeholder: |
        - Browser: Chrome 120
        - Device: iPhone 15
        - Screen size: Mobile
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: Screenshots or additional info
      description: Add any screenshots, error messages, or additional context that might help
      placeholder: You can drag and drop images here
    validations:
      required: false
