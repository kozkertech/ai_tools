[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_OPTIONS = "--max_old_space_size=4096"

[functions]
  directory = "netlify/functions"

[build.processing.html]
  pretty_urls = true
