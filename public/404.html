<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | KozkerTech</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #1f2937;
      --muted: #f3f4f6;
      --muted-foreground: #6b7280;
      --primary: #FF6E30;
      --primary-foreground: #ffffff;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1f2937;
        --foreground: #f3f4f6;
        --muted: #374151;
        --muted-foreground: #9ca3af;
        --primary: #FF6E30;
        --primary-foreground: #ffffff;
      }
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    header {
      height: 64px;
      border-bottom: 1px solid var(--muted);
      display: flex;
      align-items: center;
      padding: 0 16px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    
    .logo-primary {
      color: var(--primary);
      font-weight: bold;
      font-size: 24px;
    }
    
    .logo-secondary {
      color: var(--foreground);
      font-weight: bold;
      font-size: 24px;
    }
    
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    
    h1 {
      font-size: 64px;
      font-weight: bold;
      margin: 0;
    }
    
    h2 {
      font-size: 24px;
      font-weight: 500;
      margin: 16px 0;
      color: var(--foreground);
    }
    
    p {
      margin: 8px 0;
      color: var(--muted-foreground);
    }
    
    .home-link {
      display: inline-block;
      margin-top: 32px;
      background-color: var(--primary);
      color: var(--primary-foreground);
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .home-link:hover {
      background-color: #e05a20;
    }
    
    footer {
      border-top: 1px solid var(--muted);
      padding: 24px 16px;
      text-align: center;
    }
    
    .copyright {
      font-size: 14px;
      color: var(--muted-foreground);
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">
      <span class="logo-primary">Kozker</span>
      <span class="logo-secondary">Tech</span>
    </a>
  </header>
  
  <main>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-link">Go back home</a>
  </main>
  
  <footer>
    <p class="copyright">&copy; <script>document.write(new Date().getFullYear())</script> KozkerTech. All rights reserved.</p>
  </footer>
</body>
</html>
