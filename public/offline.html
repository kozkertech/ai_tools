<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | KozkerTech</title>
  <meta name="theme-color" content="#FF6E30">
  <link rel="icon" href="/favicon.ico">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .logo {
      max-width: 150px;
      margin: 0 auto 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #FF6E30;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .button {
      display: inline-block;
      background-color: #FF6E30;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #e55a20;
    }
    .footer {
      text-align: center;
      padding: 1rem;
      background-color: #333;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/icon-192.png" alt="KozkerTech Logo" class="logo">
    <h1>You're Offline</h1>
    <p>It looks like you're currently offline. Please check your internet connection and try again.</p>
    <p>Some features of KozkerTech are available offline, but for the full experience, you'll need to reconnect.</p>
    <a href="/" class="button">Try Again</a>
  </div>
  <div class="footer">
    &copy; 2025 KozkerTech. All rights reserved.
  </div>
</body>
</html>
